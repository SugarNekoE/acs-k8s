name: Nix
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  flake:
    runs-on: nixos-latest
    enable-openid-connect: true
    steps:
      - name: Install Node.js action runtime
        shell: sh
        run: |
          set -eu
          node_path="$(nix build --no-link --print-out-paths nixpkgs#nodejs_24)"
          echo "$node_path/bin" >> "$FORGEJO_PATH"
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate Cachix configuration
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN" || { echo "CACHIX_AUTH_TOKEN repository secret is required" >&2; exit 1; }
      - name: Validate niks3 OIDC configuration
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" || { echo "Forgejo OIDC ID token is required for niks3 upload" >&2; exit 1; }
      - name: Check flake
        run: nix flake check --print-build-logs
      - name: Build package
        run: nix build .#default --print-build-logs
      - name: Upload package to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cachix_path="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#cachix)"
          "$cachix_path/bin/cachix" push acs-k8s "$(readlink -f result)"
      - name: Upload package to niks3
        shell: bash
        run: |
          set -euo pipefail
          niks3_path="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#niks3)"
          curl_path="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#curl.bin)"
          jq_path="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#jq.bin)"
          token_script="$(mktemp)"
          trap 'rm -f "$token_script"' EXIT
          cat > "$token_script" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          "$curl_path/bin/curl" -fsS -H "Authorization: Bearer \$ACTIONS_ID_TOKEN_REQUEST_TOKEN" "\$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://amber.asnk.io" |
            "$jq_path/bin/jq" '{token: .value, expires_at: ((now + 240) | todateiso8601)}'
          EOF
          chmod 700 "$token_script"
          "$niks3_path/bin/niks3" push --server-url https://amber.asnk.io --auth-token-script "$token_script" "$(readlink -f result)"
