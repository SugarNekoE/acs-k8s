name: Nix
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  flake:
    runs-on: nixos-latest
    enable-openid-connect: true
    steps:
      - name: Install Node.js action runtime
        shell: sh
        run: |
          set -eu
          node_path="$(nix build --no-link --print-out-paths nixpkgs#nodejs_24)"
          echo "$node_path/bin" >> "$FORGEJO_PATH"
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate Cachix configuration
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN" || { echo "CACHIX_AUTH_TOKEN repository secret is required" >&2; exit 1; }
      - name: Validate niks3 OIDC configuration
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" || { echo "Forgejo OIDC ID token is required for niks3 upload" >&2; exit 1; }
      - name: Set up niks3 cache
        uses: https://github.com/Mic92/niks3-action@6d24bc1d87acdfac8e5dc3266f7b28ae99051adf # v1.5.0
        with:
          server-url: https://amber.asnk.io
      - name: Check flake
        run: nix flake check --print-build-logs
      - name: Build package
        run: nix build .#default --print-build-logs
      - name: Upload package to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cachix_path="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#cachix)"
          "$cachix_path/bin/cachix" push acs-k8s "$(readlink -f result)"
